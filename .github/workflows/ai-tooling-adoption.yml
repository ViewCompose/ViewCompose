name: AI tooling adoption

on:
  pull_request:
    paths:
      - ".github/workflows/ai-tooling-adoption.yml"
      - "tools/ai/**"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-tooling-adoption.yml"
      - "tools/ai/**"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

concurrency:
  group: ai-tooling-adoption-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrapAdoption:
    name: Bootstrap adoption (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      VIEWCOMPOSE_REQUIRE_READY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify exact-version npm bootstrap adoption
        run: npm --prefix tools/ai run verify:bootstrap-adoption
