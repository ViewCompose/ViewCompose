name: AI tooling npm bootstrap

on:
  workflow_dispatch:

concurrency:
  group: ai-tooling-npm-bootstrap
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    name: Publish one-time npm bootstrap identity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ai-tooling-release

    steps:
      - name: Require the immutable default-branch dispatch
        run: |
          test "$GITHUB_REF" = "refs/heads/$GITHUB_DEFAULT_BRANCH"
          test "$GITHUB_REPOSITORY" = "ViewCompose/ViewCompose"
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Checkout dispatched revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm publication client
        run: npm install --global npm@11.8.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify frozen stable release candidate
        run: |
          chmod +x gradlew
          ./gradlew verifyAiToolingRelease --stacktrace
          npm --prefix tools/ai run verify:release -- --tag ai-tooling-v0.4.0

      - name: Require an empty npm package identity
        run: |
          registry_error="$RUNNER_TEMP/viewcompose-bootstrap-registry.error"
          if npm view @viewcompose/ai-tooling version 2>"$registry_error"; then
            echo "@viewcompose/ai-tooling already exists; the one-time bootstrap workflow cannot run." >&2
            exit 1
          elif ! grep -q "E404" "$registry_error"; then
            cat "$registry_error" >&2
            echo "npm registry availability could not be proven." >&2
            exit 1
          fi

      - name: Build and verify reproducible prerelease seed
        id: seed
        run: |
          stable_archive="$GITHUB_WORKSPACE/tools/ai/build/distribution/viewcompose-ai-tooling-0.4.0.tgz"
          stable_root="$RUNNER_TEMP/viewcompose-stable"
          first_root="$RUNNER_TEMP/viewcompose-seed-first"
          second_root="$RUNNER_TEMP/viewcompose-seed-second"
          first_pack="$RUNNER_TEMP/viewcompose-seed-first-pack"
          second_pack="$RUNNER_TEMP/viewcompose-seed-second-pack"
          mkdir -p "$stable_root" "$first_pack" "$second_pack"
          tar -xzf "$stable_archive" -C "$stable_root"
          node tools/ai/scripts/npm-bootstrap-seed.mjs create \
            --stable-root "$stable_root/package" \
            --seed-root "$first_root"
          node tools/ai/scripts/npm-bootstrap-seed.mjs create \
            --stable-root "$stable_root/package" \
            --seed-root "$second_root"
          npm pack "$first_root" --json --ignore-scripts --pack-destination "$first_pack" \
            > "$RUNNER_TEMP/viewcompose-seed-first-pack.json"
          npm pack "$second_root" --json --ignore-scripts --pack-destination "$second_pack" \
            > "$RUNNER_TEMP/viewcompose-seed-second-pack.json"
          first_archive="$first_pack/viewcompose-ai-tooling-0.4.0-bootstrap.0.tgz"
          second_archive="$second_pack/viewcompose-ai-tooling-0.4.0-bootstrap.0.tgz"
          cmp "$first_archive" "$second_archive"
          stable_inventory="$RUNNER_TEMP/viewcompose-stable-inventory"
          seed_inventory="$RUNNER_TEMP/viewcompose-seed-inventory"
          tar -tzf "$stable_archive" | sort > "$stable_inventory"
          tar -tzf "$first_archive" | sort > "$seed_inventory"
          cmp "$stable_inventory" "$seed_inventory"
          packed_root="$RUNNER_TEMP/viewcompose-seed-packed"
          mkdir -p "$packed_root"
          tar -xzf "$first_archive" -C "$packed_root"
          node tools/ai/scripts/npm-bootstrap-seed.mjs verify \
            --stable-root "$stable_root/package" \
            --seed-root "$packed_root/package"
          smoke_project="$RUNNER_TEMP/viewcompose-seed-smoke-project"
          mkdir -p "$smoke_project"
          framework_profile=$(jq -r '.frameworkProfile.profileId' "$packed_root/package/distribution.json")
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"npm-bootstrap","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | VIEWCOMPOSE_PROJECT_ROOT="$smoke_project" \
              VIEWCOMPOSE_FRAMEWORK_PROFILE="$framework_profile" \
              node "$packed_root/package/scripts/mcp-server.mjs" \
              > "$RUNNER_TEMP/viewcompose-seed-mcp.jsonl"
          jq -e -s '(map(select(.id == 1))[0].result.protocolVersion == "2025-11-25") and ((map(select(.id == 2))[0].result.tools | length) == 13)' \
            "$RUNNER_TEMP/viewcompose-seed-mcp.jsonl"
          echo "archive=$first_archive" >> "$GITHUB_OUTPUT"

      - name: Publish the one-time bootstrap dist-tag with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: >-
          npm publish
          "${{ steps.seed.outputs.archive }}"
          --access public
          --tag bootstrap
          --provenance

      - name: Verify the isolated public bootstrap identity
        run: |
          test "$(npm view @viewcompose/ai-tooling@0.4.0-bootstrap.0 version)" = "0.4.0-bootstrap.0"
          dist_tags=$(npm view @viewcompose/ai-tooling dist-tags --json)
          test "$(jq -r '.bootstrap' <<<"$dist_tags")" = "0.4.0-bootstrap.0"
          test "$(jq -r 'has("latest")' <<<"$dist_tags")" = "false"
          stable_error="$RUNNER_TEMP/viewcompose-stable-registry.error"
          if npm view @viewcompose/ai-tooling@0.4.0 version 2>"$stable_error"; then
            echo "Stable 0.4.0 appeared during bootstrap publication." >&2
            exit 1
          else
            grep -q "E404" "$stable_error"
          fi
          provenance_type=$(npm view @viewcompose/ai-tooling@0.4.0-bootstrap.0 \
            dist.attestations.provenance.predicateType)
          test "$provenance_type" = "https://slsa.dev/provenance/v1"
