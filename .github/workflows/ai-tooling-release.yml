name: AI tooling release

on:
  push:
    tags:
      - "ai-tooling-v*"

concurrency:
  group: ai-tooling-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Verify and publish AI tooling
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify release contract and reproducible distribution
        run: |
          chmod +x gradlew
          ./gradlew verifyAiToolingRelease --stacktrace
          npm --prefix tools/ai run verify:release -- --tag "$GITHUB_REF_NAME"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            tools/ai/build/distribution/viewcompose-ai-tooling-0.1.0.tgz
            tools/ai/build/distribution/manifest.json
            tools/ai/build/distribution/SHA256SUMS

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            tools/ai/build/distribution/viewcompose-ai-tooling-0.1.0.tgz \
            tools/ai/build/distribution/manifest.json \
            tools/ai/build/distribution/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ViewCompose AI tooling 0.1.0" \
            --generate-notes
