name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qaQuick:
    name: qaQuick
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate CI-only Maven signing key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "ViewCompose CI <ci@viewcompose.invalid>" rsa2048 sign 1d

      - name: Run qaQuick
        env:
          VIEWCOMPOSE_RELEASE_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Release R8, lint, and documentation generation share this Gradle process. Keep the
        # complete gate while preventing the hosted runner's default 2 GiB heap from exhausting.
        run: >-
          ./gradlew
          -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8"
          --max-workers=2
          qaQuick
          --stacktrace

  qaPreview:
    name: qaPreview
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate CI-only Maven signing key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "ViewCompose CI <ci@viewcompose.invalid>" rsa2048 sign 1d

      - name: Run qaPreview
        run: ./gradlew qaPreview --stacktrace

      - name: Upload qaPreview failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-preview-failure-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            viewcompose-preview/build/paparazzi/failures/
            viewcompose-preview/build/reports/paparazzi/
            viewcompose-preview/build/reports/tests/testDebugUnitTest/
            viewcompose-preview/build/test-results/testDebugUnitTest/
