name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_full:
        description: Run every verification workflow regardless of the diff
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Plan verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      qa_quick: ${{ steps.impact.outputs.qa_quick }}
      qa_quick_mode: ${{ steps.impact.outputs.qa_quick_mode }}
      qa_preview: ${{ steps.impact.outputs.qa_preview }}
      full_fallback: ${{ steps.impact.outputs.full_fallback }}
      gate_families: ${{ steps.impact.outputs.gate_families }}
      direct_artifacts: ${{ steps.impact.outputs.direct_artifacts }}
      direct_projects: ${{ steps.impact.outputs.direct_projects }}
      dependency_closure: ${{ steps.impact.outputs.dependency_closure }}
      reverse_dependent_closure: ${{ steps.impact.outputs.reverse_dependent_closure }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Classify pull-request impact
        id: impact
        env:
          VIEWCOMPOSE_IMPACT_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          VIEWCOMPOSE_IMPACT_HEAD_REVISION: ${{ github.sha }}
          VIEWCOMPOSE_IMPACT_EVENT_NAME: ${{ github.event_name }}
          VIEWCOMPOSE_FORCE_FULL: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-verification')) || inputs.force_full || false }}
        run: |
          ./gradlew -p tools/viewcompose-quality-build planPullRequestImpact --stacktrace
          cat tools/viewcompose-quality-build/build/reports/pull-request-impact/github-output.txt >> "$GITHUB_OUTPUT"
          cat tools/viewcompose-quality-build/build/reports/pull-request-impact/summary.md >> "$GITHUB_STEP_SUMMARY"

  qaQuickWork:
    name: qaQuick work
    needs: classify
    if: needs.classify.outputs.qa_quick == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VIEWCOMPOSE_DOCUMENTATION_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      VIEWCOMPOSE_RELEASE_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate CI-only Maven signing key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "ViewCompose CI <ci@viewcompose.invalid>" rsa2048 sign 1d

      - name: Run affected qaQuick candidate
        id: affected
        if: >-
          needs.classify.outputs.qa_quick_mode == 'affected' ||
          needs.classify.outputs.qa_quick_mode == 'affected-with-shadow'
        continue-on-error: true
        env:
          VIEWCOMPOSE_AFFECTED_GATE_FAMILIES: ${{ needs.classify.outputs.gate_families }}
          VIEWCOMPOSE_AFFECTED_DIRECT_ARTIFACTS: ${{ needs.classify.outputs.direct_artifacts }}
          VIEWCOMPOSE_AFFECTED_DIRECT_PROJECTS: ${{ needs.classify.outputs.direct_projects }}
          VIEWCOMPOSE_AFFECTED_DEPENDENCY_CLOSURE: ${{ needs.classify.outputs.dependency_closure }}
          VIEWCOMPOSE_AFFECTED_REVERSE_DEPENDENT_CLOSURE: ${{ needs.classify.outputs.reverse_dependent_closure }}
        run: >-
          ./gradlew
          -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8"
          --max-workers=2
          qaAffected
          --stacktrace

      - name: Run complete qaQuick
        id: complete
        if: >-
          always() &&
          (needs.classify.outputs.qa_quick_mode == 'complete' ||
          needs.classify.outputs.qa_quick_mode == 'affected-with-shadow')
        continue-on-error: true
        # Release R8, lint, and documentation generation share this Gradle process. Keep the
        # selected complete path below the hosted runner's default 2 GiB heap ceiling.
        run: >-
          ./gradlew
          -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8"
          --max-workers=2
          qaQuick
          --stacktrace

      - name: Verify pinned AI compiler corpus
        if: >-
          !cancelled() &&
          (steps.affected.outcome == 'success' || steps.complete.outcome == 'success')
        run: |
          ./gradlew :tools:ai-compiler-harness:prepareAiCompilerLane
          npm --prefix tools/ai run verify:phase2-compile

      - name: Report qaQuick execution mode
        if: always()
        env:
          QA_QUICK_MODE: ${{ needs.classify.outputs.qa_quick_mode }}
          FULL_FALLBACK: ${{ needs.classify.outputs.full_fallback }}
          AFFECTED_OUTCOME: ${{ steps.affected.outcome }}
          COMPLETE_OUTCOME: ${{ steps.complete.outcome }}
        run: |
          if [[ -f build/reports/viewcompose-quality/affected-verification.md ]]; then
            cat build/reports/viewcompose-quality/affected-verification.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "qaQuick mode=$QA_QUICK_MODE affected candidate=$AFFECTED_OUTCOME complete=$COMPLETE_OUTCOME full fallback=$FULL_FALLBACK" >> "$GITHUB_STEP_SUMMARY"
          case "$QA_QUICK_MODE" in
            complete)
              if [[ "$FULL_FALLBACK" != "true" || "$AFFECTED_OUTCOME" != "skipped" || "$COMPLETE_OUTCOME" != "success" ]]; then
                echo "Complete qaQuick mode produced fallback=$FULL_FALLBACK affected=$AFFECTED_OUTCOME complete=$COMPLETE_OUTCOME" >&2
                exit 1
              fi
              ;;
            affected-with-shadow)
              if [[ "$FULL_FALLBACK" == "true" || "$AFFECTED_OUTCOME" != "success" || "$COMPLETE_OUTCOME" != "success" ]]; then
                echo "Affected-with-shadow mode produced fallback=$FULL_FALLBACK affected=$AFFECTED_OUTCOME complete=$COMPLETE_OUTCOME" >&2
                exit 1
              fi
              ;;
            affected)
              if [[ "$FULL_FALLBACK" == "true" || "$AFFECTED_OUTCOME" != "success" || "$COMPLETE_OUTCOME" != "skipped" ]]; then
                echo "Affected qaQuick mode produced fallback=$FULL_FALLBACK affected=$AFFECTED_OUTCOME complete=$COMPLETE_OUTCOME" >&2
                exit 1
              fi
              ;;
            *)
              echo "Selected qaQuick work received unsupported mode: $QA_QUICK_MODE" >&2
              exit 1
              ;;
          esac

  qaQuick:
    name: qaQuick
    needs:
      - classify
      - qaQuickWork
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report qaQuick result
        env:
          PLAN_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.qa_quick }}
          WORK_RESULT: ${{ needs.qaQuickWork.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "Impact planning failed with result: $PLAN_RESULT" >&2
            exit 1
          fi
          if [[ "$SELECTED" == "true" && "$WORK_RESULT" != "success" ]]; then
            echo "Selected qaQuick work ended with result: $WORK_RESULT" >&2
            exit 1
          fi
          if [[ "$SELECTED" != "true" && "$WORK_RESULT" != "skipped" ]]; then
            echo "Unselected qaQuick work unexpectedly ended with result: $WORK_RESULT" >&2
            exit 1
          fi
          echo "qaQuick selection=$SELECTED result=$WORK_RESULT"

  qaPreviewWork:
    name: qaPreview work
    needs: classify
    if: needs.classify.outputs.qa_preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate CI-only Maven signing key
        run: |
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "ViewCompose CI <ci@viewcompose.invalid>" rsa2048 sign 1d

      - name: Run qaPreview
        run: ./gradlew qaPreview --stacktrace

      - name: Verify AI Preview render corpus
        run: npm --prefix tools/ai run verify:phase2-render

      - name: Print AI Preview failure diagnostics
        if: failure()
        run: |
          worker_log="samples/counter/build/viewcompose-preview/debug/worker/worker.log"
          if [[ -f "$worker_log" ]]; then
            echo "ViewCompose Preview worker log:"
            tail -n 200 "$worker_log"
          else
            echo "ViewCompose Preview worker log was not produced."
          fi
          shopt -s globstar nullglob
          for response in samples/counter/build/viewcompose-preview/debug/render-cache/**/response.json; do
            echo "ViewCompose Preview structured response: $response"
            sed -n '1,240p' "$response"
          done

      - name: Upload qaPreview failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-preview-failure-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            viewcompose-preview/build/paparazzi/failures/
            viewcompose-preview/build/reports/paparazzi/
            viewcompose-preview/build/reports/tests/testDebugUnitTest/
            viewcompose-preview/build/test-results/testDebugUnitTest/
            samples/counter/build/viewcompose-preview/debug/worker/worker.log
            samples/counter/build/viewcompose-preview/debug/render-cache/**/response.json

  qaPreview:
    name: qaPreview
    needs:
      - classify
      - qaPreviewWork
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report qaPreview result
        env:
          PLAN_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.qa_preview }}
          WORK_RESULT: ${{ needs.qaPreviewWork.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "Impact planning failed with result: $PLAN_RESULT" >&2
            exit 1
          fi
          if [[ "$SELECTED" == "true" && "$WORK_RESULT" != "success" ]]; then
            echo "Selected qaPreview work ended with result: $WORK_RESULT" >&2
            exit 1
          fi
          if [[ "$SELECTED" != "true" && "$WORK_RESULT" != "skipped" ]]; then
            echo "Unselected qaPreview work unexpectedly ended with result: $WORK_RESULT" >&2
            exit 1
          fi
          echo "qaPreview selection=$SELECTED result=$WORK_RESULT"
