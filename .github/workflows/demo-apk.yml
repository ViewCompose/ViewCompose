name: Demo APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/demo-apk.yml"

permissions:
  contents: read

concurrency:
  group: demo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Demo APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare verification artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:8}"
          mkdir -p demo-apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            "demo-apk/ViewCompose-demo-debug-${short_sha}.apk"
          (
            cd demo-apk
            sha256sum *.apk > SHA256SUMS.txt
          )
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > demo-apk/BUILD_INFO.txt

      - name: Upload Demo APK
        uses: actions/upload-artifact@v7
        with:
          name: viewcompose-demo-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: demo-apk/
