name: Documentation

on:
  # This workflow is a required status check. Keep it present for every PR;
  # path-filtered required workflows otherwise remain pending forever.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/documentation.yml"
      - "docs/**"
      - "website/**"
      - "**/src/main/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/viewcompose-documentation-releases.properties"
      - "gradle/viewcompose-publishing.properties"
      - "tools/viewcompose-publishing-build/**"
  workflow_dispatch:
    inputs:
      force_full:
        description: Run the complete documentation workflow regardless of the diff
        required: false
        default: true
        type: boolean

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Plan documentation verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      documentation: ${{ steps.impact.outputs.documentation }}
      full_fallback: ${{ steps.impact.outputs.full_fallback }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Classify pull-request impact
        id: impact
        env:
          VIEWCOMPOSE_IMPACT_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          VIEWCOMPOSE_IMPACT_HEAD_REVISION: ${{ github.sha }}
          VIEWCOMPOSE_IMPACT_EVENT_NAME: ${{ github.event_name }}
          VIEWCOMPOSE_FORCE_FULL: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-verification')) || inputs.force_full || false }}
        run: |
          ./gradlew -p tools/viewcompose-quality-build planPullRequestImpact --stacktrace
          cat tools/viewcompose-quality-build/build/reports/pull-request-impact/github-output.txt >> "$GITHUB_OUTPUT"
          cat tools/viewcompose-quality-build/build/reports/pull-request-impact/summary.md >> "$GITHUB_STEP_SUMMARY"

  buildDocumentation:
    name: Build documentation work
    needs: classify
    if: needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17.0.20+8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Plan versioned API cache
        id: api-cache-plan
        run: |
          node website/scripts/versioned-api-cache.mjs plan \
            --repository . \
            --json-output build/reports/documentation/versioned-api-cache-plan.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Restore verified versioned API candidates
        id: api-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            website/generated/api
            build/versioned-api-cache
          key: viewcompose-api-v1-${{ runner.os }}-${{ steps.api-cache-plan.outputs.generator_fingerprint }}-${{ steps.api-cache-plan.outputs.complete_fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            viewcompose-api-v1-${{ runner.os }}-${{ steps.api-cache-plan.outputs.generator_fingerprint }}-${{ steps.api-cache-plan.outputs.complete_fingerprint }}-
            viewcompose-api-v1-${{ runner.os }}-${{ steps.api-cache-plan.outputs.generator_fingerprint }}-

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Verify documentation sources and translations
        env:
          VIEWCOMPOSE_DOCUMENTATION_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./gradlew verifyDocumentationStructure --stacktrace

      - name: Generate and verify complete versioned API reference
        env:
          VIEWCOMPOSE_API_DOCS_MAX_PARALLEL_REVISIONS: "1"
        run: ./gradlew verifyCompleteViewComposeApiDocs --stacktrace

      - name: Report versioned API cache result
        id: api-cache-result
        env:
          MATCHED_CACHE_KEY: ${{ steps.api-cache-restore.outputs.cache-matched-key }}
          DESIRED_CACHE_PREFIX: viewcompose-api-v1-${{ runner.os }}-${{ steps.api-cache-plan.outputs.generator_fingerprint }}-${{ steps.api-cache-plan.outputs.complete_fingerprint }}-
        run: |
          node website/scripts/versioned-api-cache.mjs report \
            --report build/reports/documentation/versioned-api-cache-report.json \
            --matched-key "$MATCHED_CACHE_KEY" \
            --desired-prefix "$DESIRED_CACHE_PREFIX" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-output build/reports/documentation/versioned-api-cache-summary.md
          cat build/reports/documentation/versioned-api-cache-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate website catalogs
        working-directory: website
        run: npm run generate:catalog

      - name: Type-check website
        working-directory: website
        run: npm run typecheck:prepared

      - name: Build website
        working-directory: website
        run: npm run build:prepared

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

      - name: Save trusted versioned API cache on main
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.api-cache-result.outputs.save_required == 'true' &&
          steps.api-cache-restore.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            website/generated/api
            build/versioned-api-cache
          key: ${{ steps.api-cache-restore.outputs.cache-primary-key }}

  build:
    name: Build documentation
    needs:
      - classify
      - buildDocumentation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report documentation result
        env:
          PLAN_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.documentation }}
          WORK_RESULT: ${{ needs.buildDocumentation.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "Impact planning failed with result: $PLAN_RESULT" >&2
            exit 1
          fi
          if [[ "$SELECTED" == "true" && "$WORK_RESULT" != "success" ]]; then
            echo "Selected documentation work ended with result: $WORK_RESULT" >&2
            exit 1
          fi
          if [[ "$SELECTED" != "true" && "$WORK_RESULT" != "skipped" ]]; then
            echo "Unselected documentation work unexpectedly ended with result: $WORK_RESULT" >&2
            exit 1
          fi
          echo "documentation selection=$SELECTED result=$WORK_RESULT"

  deploy:
    name: Deploy documentation
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      needs.buildDocumentation.result == 'success'
    needs:
      - build
      - buildDocumentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Verify deployed module routes
        working-directory: website
        env:
          DOCUMENTATION_BASE_URL: https://docs.viewcompose.com
        run: npm run verify:deployment
