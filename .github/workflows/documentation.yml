name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/documentation.yml"
      - "docs/**"
      - "website/**"
      - "**/src/main/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/viewcompose-publishing.properties"
      - "tools/viewcompose-publishing-build/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/documentation.yml"
      - "docs/**"
      - "website/**"
      - "**/src/main/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/viewcompose-publishing.properties"
      - "tools/viewcompose-publishing-build/**"
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Verify documentation sources
        run: ./gradlew verifyDocumentationStructure --stacktrace

      - name: Verify documentation translations
        working-directory: website
        run: npm run test:translations && npm run verify:translations

      - name: Generate versioned API reference
        run: ./gradlew assembleViewComposeApiDocs --stacktrace

      - name: Type-check website
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
