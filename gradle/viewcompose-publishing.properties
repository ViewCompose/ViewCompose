# Stable Maven namespace. Maven Central publication requires verified ownership of viewcompose.com.
maven.group=com.viewcompose
project.url=https://github.com/ViewCompose/ViewCompose
project.scm.connection=scm:git:https://github.com/ViewCompose/ViewCompose.git
project.scm.developerConnection=scm:git:ssh://git@github.com/ViewCompose/ViewCompose.git
project.scm.url=https://github.com/ViewCompose/ViewCompose

# Modules whose public/protected API documentation baseline is complete. Dokka warnings are merge
# failures for these modules; append modules only after their full API surface passes strict review.
apiDocs.strictModules=viewcompose-runtime,viewcompose-ui-contract,viewcompose-ui-foundation,viewcompose-renderer-android,viewcompose-host-android,viewcompose-material3,viewcompose-material3-android,viewcompose-oneui7,viewcompose-android,viewcompose-text-core,viewcompose-navigation-core,viewcompose-navigation-android,viewcompose-overlay-android,viewcompose-overlay-material3-android,viewcompose-overlay-oneui7-android,viewcompose-lifecycle-androidx,viewcompose-viewmodel-androidx,viewcompose-animation-core,viewcompose-animation,viewcompose-gesture-core,viewcompose-gesture,viewcompose-graphics-core,viewcompose-graphics,viewcompose-shadow-android,viewcompose-constraintlayout-androidx,viewcompose-image-coil,viewcompose-image-glide,viewcompose-preview-core,viewcompose-preview-gradle-plugin,viewcompose-preview-runner,viewcompose-preview-worker-host,viewcompose-preview

# Registered artifacts that have not completed their first Maven Central publication. The release
# planner permits a missing tag only for this explicit set; remove an artifact after pushing its
# first signed maven/<artifact>/<version> tag.
release.unpublishedModules=viewcompose-ui-foundation,viewcompose-renderer-android,viewcompose-navigation-android,viewcompose-overlay-material3-android,viewcompose-overlay-oneui7-android,viewcompose-lifecycle-androidx,viewcompose-viewmodel-androidx,viewcompose-constraintlayout-androidx,viewcompose-material3,viewcompose-material3-android,viewcompose-oneui7,viewcompose-android
# Historical coordinates remain valid documentation evidence but are no longer active projects.
release.retiredModules=viewcompose-widget-core,viewcompose-renderer,viewcompose-navigation,viewcompose-lifecycle,viewcompose-viewmodel,viewcompose-widget-constraintlayout

